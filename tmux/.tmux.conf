# --- General sane defaults ---
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g default-terminal "tmux-256color"

# --- Prefix: Cmd+F ---
# A terminal never transmits a literal "Cmd" modifier over the tty, so tmux
# can only bind the underlying key your terminal app sends. Remap Cmd+F in
# your terminal's keyboard settings to send Ctrl-F, and it'll act as prefix.
unbind C-b
set -g prefix C-f
bind C-f send-prefix

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# --- Pane splits ---
bind - split-window -v
bind \\ split-window -h

# --- TPM (Tmux Plugin Manager) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'erikw/tmux-powerline'

# tmux-powerline settings
set -g status-left-length 60
set -g status-right-length 90

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
